name: lift status
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fetch_status.py data/szczyrk.status.json
      - name: commit if changed
        run: |
          git config user.name "status bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/szczyrk.status.json
          git diff --cached --quiet || (git commit -m "chore: lift status" && git push)
